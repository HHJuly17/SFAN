name: SFAN
model_type: SRModel
scale: 2
num_gpu: 1
manual_seed: 10
datasets:
  train:
    name: DeepRockSR_train
    type: PairedImageDataset
    dataroot_gt: ./RockDataSet/RockDataSet/DeepRockSR_train/carbonate2D/carbonate2D_train_HR
    dataroot_lq: ./RockDataSet/RockDataSet/DeepRockSR_train/carbonate2D/carbonate2D_train_LR_default_X2
#    filename_tmpl: '{}x2'
    io_backend:
      type: disk
    gt_size: 128
    # 数据增强
    use_flip: true
    use_rot: true
    # 数据加载
    use_shuffle: true
    num_worker_per_gpu: 6
    batch_size_per_gpu: 4
    accum_iter: 4
    dataset_enlarge_ratio: 1
    prefetch_mode: ~
  val:
    name: DeepRockSR_test
    type: PairedImageDataset
    dataroot_gt: ./RockDataSet/RockDataSet/DeepRockSR_test/carbonate2D/carbonate2D_test_HR
    dataroot_lq: ./RockDataSet/RockDataSet/DeepRockSR_test/carbonate2D/carbonate2D_test_LR_default_X2
    io_backend:
      type: disk
    use_flip: false
    use_rot: false
network_g:
  type: MAN
  n_resblocks: 24
  n_resgroups: 1
  n_colors: 3
  n_feats: 60
  scale: 2
  res_scale: 1.0
  share_num: 4
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~
train:
  ema_decay: 0.999
  optim_g:
    type: Adam
    lr: 0.0005
    weight_decay: 0
    betas: [0.9, 0.99]
  scheduler:
    type: CosineAnnealingRestartLR
    periods: [1600000]
    restart_weights: [1]
    eta_min: !!float 1e-7
  total_iter: 80000
  warmup_iter: -1
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean
val:
  val_freq: !!float 5e3
  save_img: false
  pbar: false
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 2
      test_y_channel: true
    ssim:
      type: calculate_ssim
      crop_border: 2
      test_y_channel: true
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~
dist_params:
  backend: nccl
  port: 29500
